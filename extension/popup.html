<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>HTRN B2B Sales CRM</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1f2937;
      background: #fdfdfd;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #1a472a;
      color: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      margin: 0;
    }
    .sub {
      font-size: 11px;
      color: #6b7280;
      margin: 0;
    }
    .section {
      margin-top: 14px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #065f46;
      background: #ecfdf5;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid #a7f3d0;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    .input-group {
      margin-top: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 12px;
      outline: none;
    }
    input:focus {
      border-color: #1a472a;
    }
    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      background: #1a472a;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      background: #143620;
    }
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #f3f4f6;
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">H</div>
    <div>
      <h1 class="title">HTRN B2B CRM</h1>
      <p class="sub">PT Haturan Spice Indonesia</p>
    </div>
  </div>

  <div class="section">
    <div class="status-badge">
      <div class="dot"></div>
      <span id="conn-status">Terhubung ke HTRN Local</span>
    </div>
  </div>

  <div class="section input-group">
    <label for="api-base-input">API Endpoint Server:</label>
    <input type="text" id="api-base-input" value="http://localhost:3000">
    <button class="btn" id="save-btn">Simpan Pengaturan</button>
  </div>

  <div class="footer">
    Buka <a href="https://mail.google.com" target="_blank" style="color:#1a472a;font-weight:600;">Gmail</a> untuk mengaktifkan dock CRM.
  </div>

  <script src="popup.js"></script>
</body>
</html>
